cvm-version: 0.14.14
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "kimi-k3"
    repo: "moonshotai/Kimi-K3@a590ce090cb049c93a33dfe8c208ec652aa20503"
    mpk: "58d5e74ba6c814d4cc4511df093ede786bfbc95f766eee7a96379687ce455792_1560999034880_b59ef1dc-a9a1-5af6-8210-988d9d9d610c"
  - name: kimi-k3-dspark
    repo: Inferact/Kimi-K3-DSpark@cf6b8244620e7ea4b0651d214f28e89eac75bed6
    mpk: 2c4e2ba55c4a6636446934db00323a9dc4dafb19fccfca59239432c9ae71f8d4_7124652032_e05d9452-e8bc-5ebe-bcd6-a44a40bf60b4
    schema: 1

containers:
  - name: "kimi-k3"
    image: "ghcr.io/tinfoilsh/confidential-kimi-k3@sha256:4b88bacfed202f34cf6149693a81a8ae43337f0b9e009d912beb2fadf52bfb17" # v0.0.13
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - VLLM_DISABLE_UVA: "1"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      # Peer-mapped all-reduce workspaces (symm mem, FlashInfer IPC/MNNVL) are
      # unsafe under TDX CC. vLLM 0.29 turned FlashInfer AR on by default and
      # does not gate it behind --disable-custom-all-reduce, so disable it here.
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ALLREDUCE_USE_FLASHINFER: "0"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      - VLLM_USE_V2_MODEL_RUNNER: "1"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-58d5e74ba6c814d4cc4511df093ede786bfbc95f766eee7a96379687ce455792",
        "--speculative-config",
        '{"model":"/tinfoil/mpk/mpk-2c4e2ba55c4a6636446934db00323a9dc4dafb19fccfca59239432c9ae71f8d4","method":"dspark","num_speculative_tokens":7,"draft_sample_method":"probabilistic","rejection_sample_method":"block"}',
        "--kv-cache-dtype",
        "fp8",
        "--attention-config",
        '{"use_prefill_query_quantization":true,"mla_prefill_backend":"flashinfer"}',
        "--tensor-parallel-size",
        "8",
        "--enable-expert-parallel",
        "--mm-encoder-tp-mode",
        "data",
        "--tool-call-parser",
        "kimi_k3",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--enable-force-include-usage",
        "--reasoning-parser",
        "kimi_k3",
        "--served-model-name",
        "kimi-k3",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--trust-remote-code",
        "--trust-request-mm-kwargs",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "262144",
        "--max-num-seqs",
        "32",
        "--enable-prefix-caching",
        "--prefix-match-unit",
        "128",
        "--mamba-cache-mode",
        "align",
        "--no-enable-flashinfer-autotune",
        "--gpu-memory-utilization",
        "0.95",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
