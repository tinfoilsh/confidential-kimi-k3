cvm-version: 0.11.0
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "kimi-k3"
    repo: "moonshotai/Kimi-K3@a590ce090cb049c93a33dfe8c208ec652aa20503"
    mpk: "58d5e74ba6c814d4cc4511df093ede786bfbc95f766eee7a96379687ce455792_1560999034880_b59ef1dc-a9a1-5af6-8210-988d9d9d610c"

containers:
  - name: "kimi-k3"
    image: "ghcr.io/tinfoilsh/confidential-kimi-k3@sha256:5fdb3581961426e4948eb73198074e0ac12c2b572240bd3aefe228fa8269b24f" # v0.0.8 (rewritten at release)
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      - VLLM_USE_V2_MODEL_RUNNER: "1"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-58d5e74ba6c814d4cc4511df093ede786bfbc95f766eee7a96379687ce455792",
        "--kv-cache-dtype",
        "fp8",
        "--attention-config",
        '{"use_prefill_query_quantization":true,"mla_prefill_backend":"flashinfer"}',
        "--tensor-parallel-size",
        "8",
        "--enable-expert-parallel",
        "--mm-encoder-tp-mode",
        "data",
        "--tool-call-parser",
        "kimi_k3",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--enable-force-include-usage",
        "--reasoning-parser",
        "kimi_k3",
        "--served-model-name",
        "kimi-k3",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--trust-remote-code",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "262144",
        "--max-num-seqs",
        "32",
        "--enable-prefix-caching",
        "--mamba-cache-mode",
        "align",
        "--no-enable-flashinfer-autotune",
        "--gpu-memory-utilization",
        "0.95",
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
