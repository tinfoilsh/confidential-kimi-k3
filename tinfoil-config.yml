cvm-version: 0.10.8
cpus: 32
memory: 524288
gpus: 8

models:
  - name: "kimi-k3"
    repo: "moonshotai/Kimi-K3@9f62e4e9fffbd0a83ddd60e1c209d828994b3569"
    mpk: "7f2fefd20580bdee219185fc1c3bc17a4e9eee1302778553406055701d1de6fa_1560999030784_4fac69fe-7f94-5a1c-ad3e-a7917325a51b"
  - name: "kimi-k3-speculator"
    repo: "RedHatAI/Kimi-K3-speculator.dspark@48beb88daae33227c148ea2b78a2ac2f493dbccb"
    mpk: "df312ac14c7cbb9dd4a2d27cfebbd3008f17533872a2458d13856ce9b99dc219_9489838080_f8ccdb52-9bbb-5c6d-85c2-27a93ef9fd9c"

containers:
  - name: "kimi-k3"
    image: "ghcr.io/tinfoilsh/confidential-kimi-k3@sha256:5fdb3581961426e4948eb73198074e0ac12c2b572240bd3aefe228fa8269b24f" # v0.0.4 (rewritten at release)
    runtime: nvidia
    gpus: all
    restart: always
    env:
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      - FLASHINFER_NO_DOWNLOAD: "1"
      - NUMBA_CACHE_DIR: "/root/numba-cache"
      - RUNAI_STREAMER_MEMORY_LIMIT: "4294967296"
      - RUNAI_STREAMER_CONCURRENCY: "8"
      - VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      - VLLM_ENGINE_READY_TIMEOUT_S: "3600"
      - VLLM_USE_V2_MODEL_RUNNER: "1"
    command:
      [
        "--model",
        "/tinfoil/mpk/mpk-7f2fefd20580bdee219185fc1c3bc17a4e9eee1302778553406055701d1de6fa",
        "--kv-cache-dtype",
        "fp8",
        "--attention-config",
        '{"use_prefill_query_quantization":true,"mla_prefill_backend":"flashinfer"}',
        "--tensor-parallel-size",
        "8",
        "--enable-expert-parallel",
        "--mm-encoder-tp-mode",
        "data",
        "--tool-call-parser",
        "kimi_k3",
        "--enable-auto-tool-choice",
        "--enable-prompt-tokens-details",
        "--reasoning-parser",
        "kimi_k3",
        "--served-model-name",
        "kimi-k3",
        "--scheduling-policy",
        "priority",
        "--port",
        "8001",
        "--load-format",
        "runai_streamer",
        "--trust-remote-code",
        "--disable-custom-all-reduce",
        "--compilation-config",
        '{"pass_config":{"fuse_allreduce_rms":false}}',
        "--max-model-len",
        "262144",
        "--max-num-seqs",
        "32",
        "--enable-prefix-caching",
        "--mamba-cache-mode",
        "align",
        "--no-enable-flashinfer-autotune",
        "--speculative-config",
        '{"model":"/tinfoil/mpk/mpk-df312ac14c7cbb9dd4a2d27cfebbd3008f17533872a2458d13856ce9b99dc219","num_speculative_tokens":8,"method":"dspark","draft_sample_method":"probabilistic","rejection_sample_method":"block"}',
      ]
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=20g,mode=0700,exec
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 120m

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
    - /tokenize
    - /metrics
  paths:
    - /v1/chat/completions
    - /v1/models
    - /v1/responses
    - /tokenize
    - /metrics
    - /health
